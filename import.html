<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מטל״מ v2 · ייבוא נתונים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap" style="max-width:560px">
  <div class="card">
    <h1>ייבוא נתונים למערכת החדשה</h1>
    <p class="muted" style="margin-top:6px">מעתיק את כל גיליון הנתונים (קובץ Excel שהורדת מ-Google Sheets) אל Firebase. המערכת הקיימת לא משתנה. אפשר להריץ שוב בכל שלב — הנתונים יוחלפו בעותק העדכני.</p>
    <div id="loginBox">
      <label>שם משתמש (מנהל)</label><input id="u" autocapitalize="off" autocomplete="username">
      <label>סיסמה</label><input id="p" type="password" autocomplete="current-password">
      <button class="btn btn-primary btn-block" id="loginBtn">התחבר</button>
    </div>
    <div id="fileBox" class="hidden">
      <p class="muted" style="margin-top:10px" id="who"></p>
      <label>קובץ הנתונים (.xlsx)</label>
      <input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <button class="btn btn-primary btn-block" id="go" disabled>ייבא</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="log" id="log"></div>
    <a class="btn btn-block hidden" id="open" href="./">פתח את האפליקציה</a>
  </div>
</div>
<script type="module">
import { db, auth, login, currentKey, userKey } from "./js/fb.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, setDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { serRows } from "./js/cells.js";
const $ = id => document.getElementById(id);
const log = t => { $("log").textContent += t + "\n"; $("log").scrollTop = 1e9; };
const err = t => { $("msg").className = "msg err"; $("msg").textContent = t; };
const SKIP = ["Sessions", "SlowLog"];

onAuthStateChanged(auth, u => {
  $("loginBox").classList.toggle("hidden", !!u);
  $("fileBox").classList.toggle("hidden", !u);
  if (u) $("who").textContent = "מחובר: " + currentKey();
});
$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true; $("msg").textContent = "מתחבר...";
  try { await login($("u").value.trim(), $("p").value, t => $("msg").textContent = t); $("msg").textContent = ""; }
  catch (e) { err(e.message || String(e)); }
  $("loginBtn").disabled = false;
};
$("file").onchange = () => { $("go").disabled = !$("file").files.length; };

function sheetRows(ws) {
  if (!ws || !ws["!ref"]) return [];
  const rng = XLSX.utils.decode_range(ws["!ref"]);
  const rows = [];
  for (let r = 0; r <= rng.e.r; r++) {
    const row = [];
    for (let c = 0; c <= rng.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      let v = "";
      if (cell && cell.t !== "z" && cell.t !== "e") {
        v = cell.v;
        if (cell.t === "n" && cell.z && XLSX.SSF.is_date(cell.z)) {
          const p = XLSX.SSF.parse_date_code(cell.v);
          v = new Date(p.y, p.m - 1, p.d, p.H, p.M, Math.round(p.S));
        } else if (cell.t === "d") {
          const d = cell.v; v = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds());
        }
      }
      row.push(v);
    }
    rows.push(row);
  }
  return rows;
}
const tsStr = v => v instanceof Date ? v.toISOString() : String(v || "");

$("go").onclick = async () => {
  $("go").disabled = true; $("log").textContent = ""; $("msg").className = "msg"; $("msg").textContent = "";
  try {
    const me = currentKey();
    const own = await getDoc(doc(db, "meta", "owner"));
    if (!own.exists()) { await setDoc(doc(db, "meta", "owner"), { username: me, at: serverTimestamp() }); log("✓ נרשמת כבעלים"); }
    else if (own.data().username !== me) throw new Error("רק בעל המערכת יכול לייבא");

    log("קורא את הקובץ...");
    const wb = XLSX.read(await $("file").files[0].arrayBuffer(), { type: "array", cellNF: true, cellDates: false });
    const sheets = {};
    wb.SheetNames.forEach(n => { if (!SKIP.includes(n)) sheets[n] = sheetRows(wb.Sheets[n]); });
    const names = Object.keys(sheets);
    log(`נמצאו ${names.length} גיליונות: ${names.join(", ")}`);
    if (!sheets.Users || !sheets.People) throw new Error("הקובץ לא נראה כמו גיליון המטל״מ (חסרים Users / People)");

    // roles first (they grant access)
    const users = sheets.Users.map((r, i) => i === 0 ? r : r.map((v, j) => j === 3 ? "" : v));
    sheets.Users = users;
    let b = writeBatch(db), n = 0, roles = 0;
    for (const r of users.slice(1)) {
      if (r[2] === "" || r[2] == null) continue;
      b.set(doc(db, "roles", userKey(String(r[2]))), { role: String(r[4] || "user"), active: !!r[5], name: String(r[1] || "") });
      roles++;
    }
    await b.commit();
    log(`✓ ${roles} חשבונות משתמש`);

    const rev = Date.now();
    b = writeBatch(db); n = 0; let size = 0;
    for (const name of names) {
      if (name === "AuditLog") continue;
      const ser = serRows(sheets[name]);
      const bytes = JSON.stringify(ser).length;
      if (bytes > 900000) { log(`⚠ ${name} גדול מדי (${Math.round(bytes / 1024)}KB) — דולג`); continue; }
      b.set(doc(db, "sheets", name), { rows: ser, rev, sid: 0, by: me, at: serverTimestamp() });
      n++; size += bytes;
      if (n % 15 === 0 || size > 5e6) { await b.commit(); b = writeBatch(db); size = 0; }
      log(`  ${name}: ${sheets[name].length} שורות`);
    }
    await b.commit();
    log(`✓ ${n} גיליונות נשמרו`);

    if (sheets.AuditLog) {
      const rows = sheets.AuditLog.slice(1).filter(r => r[0] !== "");
      b = writeBatch(db); let k = 0;
      for (let i = 0; i < rows.length; i++) {
        const ts = tsStr(rows[i][0]);
        b.set(doc(db, "audit", "imp_" + String(i).padStart(5, "0") + "_" + ts.replace(/[^0-9A-Za-z]/g, "")),
          { ts, who: String(rows[i][1] || ""), action: String(rows[i][2] || ""), details: String(rows[i][3] || ""), by: me });
        if (++k % 400 === 0) { await b.commit(); b = writeBatch(db); }
      }
      await b.commit();
      log(`✓ ${rows.length} רשומות יומן פעולות`);
    }
    await setDoc(doc(db, "meta", "import"), { at: serverTimestamp(), by: me, sheets: names }, { merge: true });
    $("msg").className = "msg ok"; $("msg").textContent = "הייבוא הושלם ✓";
    $("open").classList.remove("hidden");
  } catch (e) {
    console.error(e);
    err(e.code === "permission-denied" ? "אין הרשאה — ודא שכללי האבטחה העדכניים פורסמו." : (e.message || String(e)));
    log("✗ " + $("msg").textContent);
  }
  $("go").disabled = false;
};
</script>
</body>
</html>
