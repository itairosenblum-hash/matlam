name: Deploy Firebase backend
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "js/emu.js"
      - "js/cells.js"
      - "js/server.js"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle shared code
        run: |
          mkdir -p functions/lib
          cp js/emu.js js/cells.js js/server.js functions/lib/
      - name: Install
        run: cd functions && npm install --no-audit --no-fund
      - name: Smoke test
        run: cd functions && node -e "import('./lib/emu.js').then(m=>console.log('emu ok', m.hashHex('x').length))"
      - name: Credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Mail settings
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          : > functions/.env
          [ -n "$MAIL_USER" ] && echo "MAIL_USER=$MAIL_USER" >> functions/.env
          [ -n "$MAIL_PASS" ] && echo "MAIL_PASS=$(echo "$MAIL_PASS" | tr -d ' ')" >> functions/.env
          [ -n "$ADMIN_EMAIL" ] && echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> functions/.env
          echo "mail vars: $(cut -d= -f1 functions/.env | tr '\n' ' ')"
      - name: Deploy
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project matlam-e5288 --non-interactive --force --debug 2>&1 | tee "$RUNNER_TEMP/deploy.log" | grep -v '^\[debug\]' 
      - name: Make callables public + diagnose
        if: always()
        run: |
          {
          echo "mail vars: $(cut -d= -f1 functions/.env 2>/dev/null | tr '\n' ' ')"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" 2>&1
          gcloud config set project matlam-e5288 2>&1
          for svc in api login importdata forgotpassword exportbackup; do
            echo "== $svc"
            gcloud run services add-iam-policy-binding "$svc" --region=me-west1 --member=allUsers --role=roles/run.invoker --quiet 2>&1 | tail -3
            gcloud run services get-iam-policy "$svc" --region=me-west1 --format=json 2>&1 | tr -d '\n '
            echo
          done
          echo "== probe login"
          curl -s -i -X POST https://me-west1-matlam-e5288.cloudfunctions.net/login -H 'Content-Type: application/json' -d '{"data":{}}' | head -20
          echo "== probe preflight"
          curl -s -i -X OPTIONS https://me-west1-matlam-e5288.cloudfunctions.net/importData -H 'Origin: https://itairosenblum-hash.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization' | head -20
          echo "== recent errors"
          gcloud logging read 'resource.type="cloud_run_revision" AND (severity>=WARNING OR httpRequest.status>=400)' --limit=25 --freshness=6h --format='value(timestamp,resource.labels.service_name,textPayload,jsonPayload.message,httpRequest.status)' 2>&1 | cut -c1-400
          } > "$RUNNER_TEMP/diag.txt" 2>&1 || true
          cat "$RUNNER_TEMP/diag.txt"
      - name: Publish log
        if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir logrepo && cd logrepo
          git init -q && git checkout -q -b deploy-logs
          tail -c 400000 "$RUNNER_TEMP/deploy.log" > deploy.log 2>/dev/null || echo "no log" > deploy.log
          cp "$RUNNER_TEMP/diag.txt" diag.txt 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "deploy log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-logs
